/* ================= BASE ================= */
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#eceae5;color:#111;font-family:'Lato',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}

/* ================= ÉCRAN : barre ================= */
.barre{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid #d9d5cd;
  display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px;padding:12px 22px}
.barre h1{font-family:'Jost',sans-serif;font-weight:400;font-size:15px;letter-spacing:.22em;
  text-transform:uppercase;margin:0;white-space:nowrap}
.barre h1 small{display:block;font-size:10px;letter-spacing:.16em;color:#8a857c;margin-top:3px}
.champ{display:flex;align-items:center;gap:8px}
.champ label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#6b665d}
.champ input{font-family:'Jost',sans-serif;font-size:14px;padding:7px 10px;border:1px solid #c9c4ba;
  border-radius:3px;background:#fff;min-width:210px}
.champ input:focus{outline:2px solid #111;outline-offset:-1px}
.champ input.manque{border-color:#111;border-width:2px;background:#f2f0eb}
.bouton{font-family:'Jost',sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 16px;border:1px solid #111;background:#fff;border-radius:3px}
.bouton:hover{background:#111;color:#fff}
.bouton.plein{background:#111;color:#fff}
.bouton.plein:hover{background:#000}
.barre .pousse{margin-left:auto}
.apercu-tete .maj-etat{font-size:11px;line-height:1.3;letter-spacing:.03em;text-transform:none;color:#6b665d;margin-left:auto;white-space:nowrap}
.bouton:disabled{opacity:.5;cursor:default}

/* ================= ÉCRAN : atelier ================= */
.atelier{display:flex;align-items:flex-start;gap:0}
.panneau{width:430px;flex:0 0 430px;height:calc(100vh - 68px);overflow:auto;background:#fff;
  border-right:1px solid #d9d5cd;padding:16px 18px 140px}
.panneau h2{font-family:'Jost',sans-serif;font-weight:400;font-size:12px;letter-spacing:.2em;
  text-transform:uppercase;margin:0 0 4px}
.aide{font-size:12px;line-height:1.5;color:#6b665d;margin:0 0 14px}
.groupe{border-top:1px solid #e5e1d8;padding:12px 0 4px}
.groupe-tete{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:8px}
.groupe-tete h3{font-family:'Jost',sans-serif;font-weight:700;font-size:12px;letter-spacing:.18em;
  text-transform:uppercase;margin:0}
.compte{font-size:11px;color:#8a857c;letter-spacing:.06em}
.ligne{display:flex;align-items:flex-start;gap:9px;padding:5px 6px;border-radius:3px;cursor:pointer}
.ligne:hover{background:#f5f3ee}
.ligne input{margin:2px 0 0;width:15px;height:15px;accent-color:#111;flex:0 0 auto}
.ligne .nom{font-family:'Jost',sans-serif;font-size:13px;line-height:1.35;flex:1}
.ligne .prix{font-style:italic;font-size:12px;color:#4a463f;white-space:nowrap;padding-top:1px}
.ligne.neuf .nom::after{content:'nouveau';font-family:'Lato',sans-serif;font-style:normal;
  font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#111;
  padding:1px 4px;border-radius:2px;margin-left:6px;vertical-align:2px}
.vide{font-size:12px;color:#8a857c;font-style:italic;padding:4px 6px}
.aide-bloc{margin:14px 0 0;border-top:1px solid #e5e1d8;padding-top:10px;font-size:12px;color:#4a463f}
.aide-bloc summary{cursor:pointer;letter-spacing:.06em;color:#6b665d}
.aide-bloc ol{margin:8px 0 0;padding-left:18px;line-height:1.55}
.lien-apercu,.retour-liste{display:none}
.lien-apercu a,.retour-liste{font-family:'Jost',sans-serif;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:#4a463f;text-decoration:none;border-bottom:1px solid #b8b2a8;padding-bottom:1px}
.lien-apercu a:hover,.retour-liste:hover{color:#000;border-color:#000}
.note-bas{position:fixed;left:0;bottom:0;width:430px;background:#fff;border-top:1px solid #d9d5cd;
  padding:12px 18px;display:flex;flex-direction:column;gap:8px}
.note-bas .fichier{font-family:'Jost',sans-serif;font-size:11.5px;line-height:1.4;color:#3a362f;
  word-break:break-word}
.note-bas .fichier b{font-weight:400;display:block;font-size:10px;letter-spacing:.12em;
  text-transform:uppercase;color:#8a857c;margin-bottom:3px}
.note-bas .rangee{display:flex;gap:8px}
.note-bas .rangee .bouton{flex:1;text-align:center}

/* ================= ÉCRAN : aperçu ================= */
.apercu{flex:1;min-width:0;padding:22px;overflow:auto;height:calc(100vh - 68px)}
.apercu-tete{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:4px 14px;max-width:900px;margin:0 auto 12px}
.apercu-tete span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#6b665d}
.scene{position:relative;margin:0 auto;transform-origin:top left}

/* ================= LA CARTE (A4) =================
   Langue graphique des étiquettes : Jost capitales gras très espacé pour les
   titres de section (filet fin dessous), Lato pour les noms, les prix et les
   mentions. Noir sur blanc, sans effet. */
.pages{--fs:8.8pt;--lh:1.5;--pic:4mm;--picgap:1.05mm}
.page{width:186mm;height:271mm;padding:0 4mm 4mm;background:#fff;color:#000;overflow:hidden;
  display:flex;flex-direction:column;position:relative;margin:0 auto 12mm;
  box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 30px rgba(0,0,0,.10)}
.pages .page:last-child{margin-bottom:0}

/* en-tête */
.entete{text-align:center;flex:0 0 auto;padding:1mm 0 0}
/* largeur ET hauteur fixées : tant que l'image n'est pas décodée, height:auto
   vaut 0 et la mesure de mise en page croit l'en-tête plus court qu'il n'est */
.logo{display:block;width:72mm;height:12.88mm;object-fit:contain;margin:0 auto}
.accroche{margin-top:2.1mm}
.accroche p{margin:1.05mm 0 0;font-family:'Jost',sans-serif;font-weight:400;font-size:6.1pt;
  line-height:1.5;letter-spacing:.30em;text-transform:uppercase;text-indent:.30em}
/* les deux lignes de promesse : en gras, comme demandé par Pierre le 25/11 */
.accroche p.gras{font-weight:700;letter-spacing:.26em;text-indent:.26em}

/* corps */
.corps{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:0 14mm;
  padding:5.4mm 0 0;grid-template-rows:auto}
.titre-large{grid-column:1 / -1;flex:0 0 auto}
.corps.titre-haut{grid-template-rows:auto 1fr}
.corps.trois-rangs{grid-template-rows:auto auto 1fr}
.corps.trois-rangs > .titre-large{margin-bottom:calc(var(--fs) * .8)}
.corps.trois-rangs > .colonne.fixe{margin-top:calc(var(--fs) * 1.6)}
.colonne{height:100%;overflow:hidden;min-width:0;display:flex;flex-direction:column}
.colonne > .titre{flex:0 0 auto}
.colonne > .titre:not(:first-child){margin-top:8mm}
.colonne > .produits{flex:0 1 auto}
.corps.seule{grid-template-columns:1fr}
.corps.seule .colonne{width:118mm;margin:0 auto}
.corps.seule .colonne.pleine{width:100%;margin:0}
.deux-col{display:grid;grid-template-columns:1fr 1fr;gap:0 12mm}

/* titre de section — Jost gras, capitales, très espacé, filet fin */
/* titres de section : gras, capitales espacées, ferrés à droite, sans filet
   (demande de Pierre du 25/11 : le soulignement alourdissait la page) */
.titre{font-family:'Jost',sans-serif;font-weight:700;font-size:calc(var(--fs) * 1.34);
  line-height:1.05;letter-spacing:.30em;text-transform:uppercase;text-indent:0;
  text-align:right;margin:0 0 calc(var(--fs) * 1.0)}
.titre.petit{font-size:calc(var(--fs) * 1.2)}

/* produits */
.produits{list-style:none;margin:0;padding:0}
.item{break-inside:avoid;text-align:right;margin:0 0 var(--ecart, 3.2mm)}
.item:last-child{margin-bottom:0}
.nom{display:block;font-family:'Lato',sans-serif;font-weight:400;font-size:var(--fs);
  line-height:var(--lh);letter-spacing:.055em;text-transform:uppercase}
.ligne-prix{display:block;font-family:'Lato',sans-serif;
  font-size:max(calc(var(--fs) * .92), 7pt);line-height:1.3;margin-top:.85mm}
.prix{font-style:italic;white-space:nowrap}
.mention{font-style:normal;font-size:5pt;letter-spacing:.01em;white-space:nowrap;
  margin-left:1.3mm;vertical-align:.12em}
.mention::before{content:'· '}
.pictos{display:flex;justify-content:flex-end;align-items:center;gap:var(--picgap);
  height:var(--pic);margin-top:1.25mm}
.pictos img{display:block;width:var(--pic);height:var(--pic)}
.pictos.vide{display:none}

/* blocs fixes : un peu plus serrés que les produits du jour */
.colonne.fixe{--ecart:1.9mm}
.glaces-simple{--ecart:4.2mm}

/* boissons */
.boissons{display:grid;grid-template-columns:1fr 1fr;gap:0 12mm;flex:1 1 auto;min-height:0;
  --fs:8.8pt;--lh:1.34}
.bcol{height:100%;overflow:hidden;min-width:0}
.sous-bloc{margin:0 0 calc(var(--fs) * 1.15)}
/* titres de catégorie des boissons : ferrés à droite, en gras, sans filet
   (les filets alourdissaient la page — demande de Pierre du 25/11) */
.sous-titre{font-family:'Jost',sans-serif;font-weight:700;font-size:calc(var(--fs) * .8);
  letter-spacing:.2em;text-transform:uppercase;text-indent:0;text-align:right;
  margin:0 0 1.4mm}
.b-item{text-align:right;font-family:'Lato',sans-serif;font-size:var(--fs);line-height:var(--lh);
  letter-spacing:.045em;text-transform:uppercase;margin:0 0 .55mm}
.b-item .prix-inline{font-style:italic;text-transform:none;letter-spacing:.02em}
/* la page Boissons est la plus dense de la carte : ses sous-blocs sont un peu
   plus serrés pour que l'en-tête (logo) puisse prendre sa place */
.boissons .sous-bloc{margin-bottom:calc(var(--fs) * .80)}
.boissons .b-item{margin-bottom:.30mm}
.b-note .seg{white-space:nowrap}
.b-note{text-align:right;font-family:'Lato',sans-serif;
  font-size:max(calc(var(--fs) * .78), 6.2pt);
  line-height:1.45;letter-spacing:.06em;text-transform:uppercase;margin:-.2mm 0 1.2mm}

/* encadré des formules (page 1 uniquement) */
.formules{flex:0 0 auto;width:106mm;margin:3.6mm auto 0;border:.7pt solid #000;
  padding:2.3mm 4.2mm 2.5mm}
.formules p{margin:0;display:flex;align-items:baseline;justify-content:space-between;
  gap:4mm;font-family:'Lato',sans-serif;font-size:6.9pt;letter-spacing:.055em;
  text-transform:uppercase}
.formules p + p{margin-top:1.1mm}
.formules .f-prix{font-weight:700;font-style:italic;font-size:7.8pt;letter-spacing:.02em;
  white-space:nowrap;text-transform:none}

/* dernière page : les pictogrammes et les allergènes */
.pictos-legende{display:grid;grid-template-columns:repeat(4,1fr);gap:8.5mm 6mm;margin-top:2mm}
.pl{display:flex;flex-direction:column;align-items:center;text-align:center}
.pl img{display:block;width:12mm;height:12mm;margin:0 auto 2.2mm}
.pl b{font-family:'Jost',sans-serif;font-weight:700;font-size:7.1pt;letter-spacing:.09em;
  text-transform:uppercase;line-height:1.28}
.pl i{display:block;font-family:'Lato',sans-serif;font-style:normal;font-size:6pt;
  line-height:1.35;margin-top:.8mm}
.note-legende{margin-top:9mm;border-top:.4pt solid #000;padding-top:3.4mm}
.note-legende p{font-family:'Lato',sans-serif;font-size:6.8pt;line-height:1.55;margin:0 0 1.9mm;
  text-align:left;max-width:168mm}

/* légende du pictogramme de consigne : présente seulement sur les pages qui
   portent le pictogramme (voir afficherLegendesiBesoin) */
.legende{flex:0 0 auto;display:flex;align-items:center;justify-content:center;gap:1.5mm;
  margin-top:1.8mm;font-family:'Jost',sans-serif;font-size:5.4pt;letter-spacing:.15em;
  text-transform:uppercase;text-indent:.15em}
.legende img{display:block;width:3.2mm;height:3.2mm}
.legende[hidden]{display:none}

.pied{flex:0 0 auto;display:flex;justify-content:space-between;align-items:baseline;
  font-family:'Jost',sans-serif;font-size:5.4pt;letter-spacing:.2em;text-transform:uppercase;
  border-top:.4pt solid #000;padding-top:1.6mm;margin-top:2.2mm}

/* ================= IMPRESSION ================= */
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff !important}
  .barre,.panneau,.note-bas,.apercu-tete,#verif{display:none !important}
  .atelier{display:block}
  .apercu{padding:0;height:auto;overflow:visible}
  .scene{transform:none !important;height:auto !important;width:auto !important}
  .pages{transform:none !important}
  .page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .pages .page:last-child{break-after:auto;page-break-after:auto}
}
@media (max-width:1000px){
  .atelier{flex-direction:column}
  .panneau{width:100%;flex:1 1 auto;height:auto;border-right:0;border-bottom:1px solid #d9d5cd;padding-bottom:16px}
  .note-bas{position:static;width:100%;border-top:1px solid #d9d5cd}
  .apercu{width:100%;height:auto}
}

/* ---------- téléphone (Android, iPhone) : barre compacte, cibles au doigt ---------- */
@media (max-width:700px){
  .barre{padding:9px 12px;gap:8px 10px;align-items:center}
  .barre h1{font-size:11.5px;letter-spacing:.14em}
  .barre h1 small{font-size:8.5px;letter-spacing:.1em;margin-top:2px}
  .champ{width:100%;gap:6px}
  .champ label{font-size:10px}
  .champ input{flex:1;min-width:0;font-size:15px;padding:10px 10px}
  .bouton{font-size:10.5px;letter-spacing:.06em;padding:11px 10px;min-height:44px}
  .barre .pousse{margin-left:0}
  #btn-imprimer{flex:1 1 100%;min-height:46px;font-size:12px}
  .panneau{padding:12px 12px 20px}
  .panneau h2{font-size:11px}
  .aide{font-size:11.5px;margin-bottom:10px}
  .groupe{padding:10px 0 2px}
  .groupe-tete{margin-bottom:4px}
  .groupe-tete h3{font-size:11px}
  .ligne{padding:11px 4px;align-items:flex-start;gap:11px}
  .ligne input{width:21px;height:21px;margin-top:0}
  .ligne .nom{font-size:14px;line-height:1.3}
  .ligne .prix{font-size:12.5px;padding-top:2px}
  .ligne.neuf .nom::after{font-size:8px}
  .aide-bloc{font-size:11.5px}
  .note-bas{padding:10px 12px}
  .note-bas .fichier{font-size:11px}
  .apercu{padding:12px}
  .apercu-tete{flex-wrap:wrap;gap:6px;margin-bottom:8px}
  .apercu-tete span{font-size:9.5px;letter-spacing:.1em}
  .lien-apercu{display:block;margin:0 0 10px}
  .retour-liste{display:block;margin-left:auto;font-size:9.5px}
}
</style>

</main>

const SECTIONS = [
  { cle:'entrees',  titre:'Entrées'  },
  { cle:'plats',    titre:'Plats'    },
  { cle:'desserts', titre:'Desserts' }
];

const sel = { entrees:new Set(), plats:new Set(), desserts:new Set() };
const $ = (s,r=document)=>r.querySelector(s);

/* ---------- utilitaires ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dateLongue(d){
  const s = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(d);
  return s.charAt(0).toUpperCase()+s.slice(1);
}
function dateISO(d){
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate());
}
function memoriser(cle, valeur){
  try{
    if(valeur === undefined) return localStorage.getItem(cle) || '';
    if(valeur === null) localStorage.removeItem(cle); else localStorage.setItem(cle, valeur);
  }catch(e){ /* stockage refusé : l'application marche quand même */ }
  return valeur || '';
}

/* ---------- interface : sélection ---------- */
function construirePanneau(){
  const pan = $('#selection');
  pan.innerHTML = `<p class="lien-apercu"><a href="#apercu">Voir l’aperçu de la carte imprimée ↓</a></p>`
    + SECTIONS.map(sec => {
    const items = DATA[sec.cle] || [];
    const lignes = items.length
      ? items.map((p,i) => `
        <label class="ligne${p.recent?' neuf':''}" data-cle="${sec.cle}" data-i="${i}">
          <input type="checkbox" data-cle="${sec.cle}" data-i="${i}">
          <span class="nom">${esc(p.nom)}</span>
          <span class="prix">${esc(p.prix)}</span>
        </label>`).join('')
      : `<p class="vide">Aucun produit aujourd’hui.</p>`;
    return `<div class="groupe">
      <div class="groupe-tete"><h3>${sec.titre}</h3><span class="compte" id="compte-${sec.cle}">0 / ${items.length}</span></div>
      ${lignes}
    </div>`;
  }).join('') + `
  <p class="aide" style="margin-top:16px">
    Crêpes, cookies &amp; cakes, crèmes glacées et boissons sont imprimés d’office :
    ils ne se cochent pas.
  </p>
  <details class="aide-bloc">
    <summary>Comment faire (5 étapes)</summary>
    <ol>
      <li>Ouvrez ce fichier dans un navigateur (double-clic).</li>
      <li>Écrivez le nom de la boutique en haut, puis cochez ce que vous avez en stock.</li>
      <li>Cliquez sur « Imprimer la carte », choisissez « Enregistrer au format PDF », format A4.</li>
      <li>Donnez au fichier le nom affiché en bas (bouton « Copier le nom »).</li>
      <li>Déposez le PDF dans le dossier CHEFJEAN du Drive, comme les étiquettes.</li>
    </ol>
  </details>`;

  if(!pan.dataset.lie){
    pan.dataset.lie = '1';
    pan.addEventListener('change', e => {
    const c = e.target;
    if(!c.matches('input[type=checkbox]')) return;
    const set = sel[c.dataset.cle], i = +c.dataset.i;
    c.checked ? set.add(i) : set.delete(i);
    majCompte(c.dataset.cle);
    dessiner();
    });
  }
}
function majCompte(cle){
  const n = (DATA[cle]||[]).length;
  $(`#compte-${cle}`).textContent = `${sel[cle].size} / ${n}`;
}
function majTousComptes(){ SECTIONS.forEach(s => majCompte(s.cle)); }

function restaurerCases(){
  document.querySelectorAll('#selection input[type=checkbox]').forEach(c => {
    c.checked = (sel[c.dataset.cle] || new Set()).has(+c.dataset.i);
  });
}

/* ---------- remise à jour à la demande ----------
   Relit la page publiée la plus récente (même adresse, sans cache), reprend son
   bloc de données et redessine. Les cases cochées sont conservées par nom de
   produit ; un produit nouveau arrive coché, comme à l'ouverture. */
function dateMaj(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit'}) + ' à ' +
         d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

async function remiseAJour(){
  const btn = $('#btn-maj'), et = $('#maj-etat');
  btn.disabled = true;
  et.textContent = 'Chargement…';
  try{
    const r = await fetch(location.pathname + '?maj=' + Date.now(), {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const doc = new DOMParser().parseFromString(await r.text(), 'text/html');
    const bloc = doc.getElementById('donnees-carte');
    if(!bloc) throw new Error('bloc absent');
    const nouvelles = JSON.parse(bloc.textContent);
    if(!nouvelles.produits) throw new Error('données illisibles');

    const avantNoms = {}, avantSel = {};
    SECTIONS.forEach(s => {
      avantNoms[s.cle] = new Set((DATA[s.cle]||[]).map(p => p.nom));
      avantSel[s.cle] = new Set((DATA[s.cle]||[]).filter((p,i) => sel[s.cle].has(i)).map(p => p.nom));
    });

    Object.keys(DATA).forEach(k => delete DATA[k]);
    Object.assign(DATA, nouvelles.produits);
    if(nouvelles.blocs_fixes){
      Object.keys(FIXES).forEach(k => delete FIXES[k]);
      Object.assign(FIXES, nouvelles.blocs_fixes);
    }
    SECTIONS.forEach(s => {
      sel[s.cle] = new Set();
      (DATA[s.cle]||[]).forEach((p,i) => {
        if(avantSel[s.cle].has(p.nom) || !avantNoms[s.cle].has(p.nom)) sel[s.cle].add(i);
      });
    });

    construirePanneau();
    restaurerCases();
    majTousComptes();
    dessiner();

    const change = nouvelles.genere_le !== DONNEES.genere_le;
    et.textContent = (change ? 'À jour — ' : 'Déjà à jour — ') + dateMaj(nouvelles.genere_le);
    DONNEES.date = nouvelles.date;
    DONNEES.genere_le = nouvelles.genere_le;
  }catch(e){
    et.textContent = 'Remise à jour impossible — vérifiez la connexion';
  }finally{
    btn.disabled = false;
  }
}

function choisir(liste, cle){
  return liste.map((p,i)=>({p,i})).filter(o => sel[cle].has(o.i)).map(o=>o.p);
}

/* ---------- fragments de carte ---------- */
function lignePictos(ico){
  if(!ico || !ico.length) return '';
  const imgs = ico.filter(k => PICTO[k])
    .map(k => `<img src="${PICTO[k]}" data-picto="${k}" alt="">`).join('');
  return imgs ? `<span class="pictos">${imgs}</span>` : '';
}

/* La consigne n'est plus écrite sous chaque produit : elle devient un
   pictogramme (bocal) en tête de ligne, expliqué par la légende de bas de page
   (position du mémo Graphiste : le contenant se lit avant les allergènes). */
function items(liste){
  return `<ul class="produits">` + liste.map(p => {
    const ico = (p.ico || []).slice();
    if(p.consigne && PICTO.consigne) ico.unshift('consigne');
    return `
    <li class="item"><span class="nom">${esc(p.nom)}</span>
      <span class="ligne-prix"><span class="prix">${esc(p.prix)}</span></span>
      ${lignePictos(ico)}</li>`;}).join('') + `</ul>`;
}
function itemsGlaces(liste){
  return `<ul class="produits">` + liste.map(p => `
    <li class="item"><span class="nom">${esc(p.nom)} <span class="prix-inline prix">${esc(p.prix)}</span></span>
      ${p.note?`<span class="note b-note">${esc(p.note)}</span>`:''}</li>`).join('') + `</ul>`;
}
function blocSimple(titre, liste, petit){
  return `<div class="titre${petit?' petit':''}">${titre}</div>${items(liste)}`;
}
function blocFixe(cle){
  const f = FIXES[cle];
  if(!f) return '';
  return cle==='glaces'
    ? `<div class="titre">${f.titre}</div>${itemsGlaces(f.items)}`
    : blocSimple(f.titre, f.items, true);
}
/* « ANIS VERT » ne doit pas se couper en fin de ligne : chaque terme de
   l'énumération reste d'un bloc, la coupure se fait aux virgules. */
function noteSegments(txt){
  return String(txt).split(',').map(t => `<span class="seg">${esc(t.trim())}</span>`).join(', ');
}

function blocBoissons(){
  const t = FIXES.boissons.titre;
  const cols = FIXES.boissons.colonnes.map(col => `
    <div class="bcol">
      ${col.map(sb => `
        <div class="sous-bloc">
          <div class="sous-titre">${esc(sb.sous_titre)}</div>
          ${sb.items.map(it => `<p class="b-item">${esc(it.nom)} <span class="prix-inline">| ${esc(it.prix)}</span></p>${it.note?`<p class="b-note">${noteSegments(it.note)}</p>`:''}`).join('')}
        </div>`).join('')}
    </div>`).join('');
  return `<div class="titre">${t}</div><div class="boissons">${cols}</div>`;
}

/* ---------- une page ---------- */
function page(corps, options={}){
  return `<article class="page">
    <header class="entete">
      <img class="logo" src="${LOGO}" alt="CHEFJEAN">
      <div class="accroche">
        <p>Sur place | À emporter | Livraisons</p>
        <p class="gras">Plats individuels faits maison, produits frais et de saison</p>
        <p class="gras">Chaque jour de nouvelles suggestions !</p>
      </div>
    </header>
    <div class="corps ${options.seule?'seule':''} ${options.classe||''}">${corps}</div>
    <div class="legende" hidden>${PICTO.consigne?`<img src="${PICTO.consigne}" alt="">`:''}<span>Vente à emporter : + 1,00 € de consigne</span></div>
    <footer class="pied"><span>CHEFJEAN · Montpellier</span><span class="num-page"></span></footer>
  </article>`;
}

/* la dernière page : ce que veulent dire les pictogrammes, et les allergènes */
const PICTO_LEGENDE = [
  ['rechauffer',    'À réchauffer',          ''],
  ['manger_froid',  'À manger froid',        ''],
  ['vegetarien',    'Végétarien',            'plat sans viande ni poisson'],
  ['gluten',        'Gluten',                'blé, seigle, orge'],
  ['crustaces',     'Crustacés',             ''],
  ['oeufs',         'Œufs',                  ''],
  ['poisson',       'Poisson',               ''],
  ['arachides',     'Arachides',             ''],
  ['soja',          'Soja',                  ''],
  ['lait',          'Lait',                  'lactose'],
  ['fruits_coque',  'Fruits à coque',        ''],
  ['celeri',        'Céleri',                ''],
  ['moutarde',      'Moutarde',              ''],
  ['sesame',        'Sésame',                ''],
  ['sulfites',      'Sulfites',              'SO₂'],
  ['lupin',         'Lupin',                 ''],
  ['mollusques',    'Mollusques',            ''],
  ['gelatine',      'Gélatine',              'porc ou bœuf'],
  ['porc',          'Contient du porc',      ''],
  ['consigne',      'Consigne',              'vente à emporter, + 1,00 €']
];

function pageLegende(){
  const cellules = PICTO_LEGENDE.map(([k, nom, note]) => PICTO[k] ? `
    <div class="pl"><img src="${PICTO[k]}" alt=""><b>${nom}</b>${note ? `<i>${note}</i>` : ''}</div>` : '').join('');
  return `<article class="page">
    <header class="entete">
      <img class="logo" src="${LOGO}" alt="CHEFJEAN">
      <div class="accroche">
        <p>Sur place | À emporter | Livraisons</p>
      </div>
    </header>
    <div class="corps seule">
      <div class="colonne pleine">
        <div class="titre">Les pictogrammes</div>
        <div class="pictos-legende">${cellules}</div>
        <div class="note-legende">
          <p>En tête de ligne, le mode de dégustation : le bol fumant signale un plat à réchauffer, le flocon un plat à manger froid. Les deux ne figurent jamais ensemble.</p>
          <p>La feuille signale un plat végétarien, d'après la fiche produit ; la mention n'est pas imprimée pour les desserts.</p>
          <p>Chaque pictogramme d'allergène signale un allergène déclaré sur la fiche produit. Les traces éventuelles ne sont pas distinguées : en cas d'allergie, demandez-nous.</p>
          <p>Le pictogramme gélatine signale la mention « gélatine » sur la fiche, sans en préciser l'origine. Le bocal signale la vente à emporter : 1,00 € de consigne en plus du prix affiché.</p>
          <p>Prix TTC. L'absence de pictogramme signifie que la fiche produit ne déclare aucun allergène.</p>
        </div>
      </div>
    </div>
    <footer class="pied"><span>CHEFJEAN · Montpellier</span><span class="num-page"></span></footer>
  </article>`;
}

const etat = { boutique: memoriser('chefjean.carte.boutique') };

/* ---------- composition ----------
   Deux mises en page possibles, choisies automatiquement à la mesure :
   - « reference » : entrées | plats sur la page 1, desserts | crêpes & cookies
     sur la page 2, crèmes glacées page 3, boissons page 4 (la carte d'origine).
   - « dense » : quand les pictogrammes ne tiennent plus à 7 pt, la page 1 prend
     les entrées seules sur deux colonnes, la page 2 les plats | les desserts,
     la page 3 les crêpes/cookies | les crèmes glacées. Toujours quatre pages. */
function colonneDeuxColonnes(titre, liste, classe=''){
  const moitie = Math.ceil(liste.length/2);
  return `<div class="titre-large"><div class="titre">${titre}</div></div>
    <div class="colonne ${classe}" data-fit="jour">${items(liste.slice(0,moitie))}</div>
    <div class="colonne ${classe}" data-fit="jour">${items(liste.slice(moitie))}</div>`;
}

function pageGlaces(avecTitre=true, deuxCol=true){
  const glaces = FIXES.glaces.items;
  const titre = avecTitre ? `<div class="titre">${FIXES.glaces.titre}</div>` : '';
  const corps = deuxCol
    ? `<div class="deux-col"><div>${itemsGlaces(glaces.slice(0,4))}</div><div>${itemsGlaces(glaces.slice(4))}</div></div>`
    : itemsGlaces(glaces);
  return titre + corps;
}

const FORMULES = `<div class="formules">
      <p><span>Entrée + Plat ou Plat + Dessert</span><span class="f-prix">14,90 €</span></p>
      <p><span>Entrée + Plat + Dessert</span><span class="f-prix">17,50 €</span></p>
    </div>`;

/* les formules s'affichent sur la première page seulement, et la légende des
   pictogrammes ferme toujours la carte */
function habiller(pages){
  if(pages.length) pages[0] = pages[0].replace('<div class="corps', FORMULES + '<div class="corps');
  pages.push(pageLegende());
  return pages;
}

function composer(mode){
  const entrees  = choisir(DATA.entrees, 'entrees');
  const plats    = choisir(DATA.plats, 'plats');
  const desserts = choisir(DATA.desserts, 'desserts');
  const pages = [];
  const dense = mode === 'dense';

  if(dense){
    /* page 1 : entrées sur deux colonnes (ou plats si pas d'entrée) */
    if(entrees.length){
      pages.push(page(colonneDeuxColonnes('Entrées', entrees), {classe:'titre-haut'}));
    }else if(plats.length){
      pages.push(page(colonneDeuxColonnes('Plats', plats), {classe:'titre-haut'}));
    }

    /* page 2 : plats | desserts */
    if(plats.length && desserts.length){
      pages.push(page(
        `<div class="colonne" data-fit="jour">${blocSimple('Plats', plats)}</div>
         <div class="colonne" data-fit="jour">${blocSimple('Desserts', desserts)}</div>`));
    }else if(entrees.length && plats.length){
      pages.push(page(
        `<div class="colonne" data-fit="jour">${blocSimple('Plats', plats)}</div>`, {seule:true}));
    }else if(entrees.length && desserts.length){
      pages.push(page(
        `<div class="colonne" data-fit="jour">${blocSimple('Desserts', desserts)}</div>`, {seule:true}));
    }

    /* page 3 : crèmes glacées sur toute la largeur, crêpes | cookies dessous */
    pages.push(page(
      `<div class="titre-large"><div class="titre">${FIXES.glaces.titre}</div></div>
       <div class="pleine glaces-simple" data-fit="glaces" style="grid-column:1 / -1">${pageGlaces(false)}</div>
       <div class="colonne fixe" data-fit="fixe">${blocFixe('crepes')}</div>
       <div class="colonne fixe" data-fit="fixe">${blocFixe('cookies')}</div>`,
      {classe:'trois-rangs'}));

    pages.push(page(`<div class="colonne pleine" style="grid-column:1 / -1">${blocBoissons()}</div>`, {seule:true}));
    return habiller(pages);
  }

  /* ---------- mise en page de référence ---------- */
  if(entrees.length && plats.length){
    pages.push(page(
      `<div class="colonne" data-fit="jour">${blocSimple('Entrées', entrees)}</div>
       <div class="colonne" data-fit="jour">${blocSimple('Plats', plats)}</div>`));
  }else if(entrees.length || plats.length){
    pages.push(page(
      `<div class="colonne" data-fit="jour">${blocSimple(entrees.length?'Entrées':'Plats', entrees.length?entrees:plats)}</div>`,
      {seule:true}));
  }

  const dessertsDeuxColonnes = desserts.length > 15;
  if(dessertsDeuxColonnes){
    pages.push(page(colonneDeuxColonnes('Desserts', desserts), {classe:'titre-haut'}));
  }else{
    const droite = `<div class="colonne fixe" data-fit="fixe">${blocFixe('crepes')}${blocFixe('cookies')}</div>`;
    if(desserts.length){
      pages.push(page(
        `<div class="colonne" data-fit="jour">${blocSimple('Desserts', desserts)}</div>` + droite));
    }else{
      pages.push(page(droite, {seule:true}));
    }
  }

  if(dessertsDeuxColonnes){
    pages.push(page(
      `<div class="colonne fixe" data-fit="fixe" style="height:92mm">${blocFixe('crepes')}</div>
       <div class="colonne fixe" data-fit="fixe" style="height:92mm">${blocFixe('cookies')}</div>
       <div class="colonne fixe pleine" data-fit="glaces" style="grid-column:1 / -1;height:104mm">${pageGlaces()}</div>`));
  }else{
    /* page 3 dans son entier : les glaces en une colonne centrée, comme la
       carte de référence */
    pages.push(page(
      `<div class="colonne fixe glaces-simple" data-fit="glaces">${pageGlaces(true,false)}</div>`, {seule:true}));
  }

  pages.push(page(`<div class="colonne pleine" style="grid-column:1 / -1">${blocBoissons()}</div>`, {seule:true}));
  return habiller(pages);
}

/* ---------- ajustement automatique ---------- */
/* Une seule échelle par page : toutes les colonnes d'une page partagent la même
   taille. On resserre d'abord l'interligne, puis on descend la taille, jamais
   sous 7 pt pour le texte lisible ; en dernier recours les pictogrammes passent
   de 4 à 3,6 mm (la mention de consigne reste à 5 pt). */
const ECHELLE = [[10.4,1.6],[9.9,1.58],[9.4,1.55],[9.0,1.5],[8.6,1.45],[8.2,1.4],[7.8,1.34],[7.4,1.28],[7.0,1.2],[6.6,1.16]];
const PICTOS = [['4mm','1.05mm'],['3.6mm','.9mm']];

function basDuContenu(el){
  const b = el.getBoundingClientRect();
  let bas = b.top;
  for(const c of el.children){
    const r = c.getBoundingClientRect();
    if(r.height && r.bottom > bas) bas = r.bottom;
  }
  return {boite:b, bas};
}

const MARGE_GARDE = 0.2 * 3.7795;   /* 0,2 mm de tolérance */

function deborde(el){
  /* on mesure contre la zone de contenu de la page, pas seulement contre la
     colonne : une colonne étirée par son propre contenu masquerait un
     débordement (cas de la page Boissons, qui frôle le pied de page). */
  let limite = el.getBoundingClientRect().bottom;
  const corps = el.closest('.corps');
  if(corps) limite = Math.min(limite, corps.getBoundingClientRect().bottom);
  /* on ne signale que le vrai débordement : le contenu peut finir exactement
     au bas de la colonne, il ne doit simplement pas la dépasser */
  return basDuContenu(el).bas > limite + MARGE_GARDE;
}

function appliquer(el, fs, lh, pic){
  el.style.setProperty('--fs', fs+'pt');
  el.style.setProperty('--lh', String(lh));
  el.style.setProperty('--ecart', (lh*1.95).toFixed(2)+'mm');
  if(pic){ el.style.setProperty('--pic', pic[0]); el.style.setProperty('--picgap', pic[1]); }
}

/* une colonne qui respire répartit la place libre dans l'interligne */
function repartir(el){
  /* les blocs fixes (crêpes, cookies) restent tassés comme les boissons :
     pas de répartition de la place libre entre les variétés */
  if(el.classList.contains('fixe')) return;
  const produits = el.querySelectorAll('.item, .b-item');
  if(produits.length < 3) return;
  const ecart0 = parseFloat(el.style.getPropertyValue('--ecart')) || 3.2;
  const {boite, bas} = basDuContenu(el);
  const libre = (boite.bottom - bas) / 3.7795;
  if(libre < 26) return;
  let extra = Math.min((libre * 0.55) / (produits.length - 1), 10);
  for(let i = 0; i < 4 && extra > 0.3; i++){
    el.style.setProperty('--ecart', (ecart0 + extra).toFixed(2) + 'mm');
    if(!deborde(el)) return;
    extra *= 0.5;
  }
  el.style.setProperty('--ecart', ecart0.toFixed(2) + 'mm');
}

function ajusterPage(pageEl){
  const blocs = Array.from(pageEl.querySelectorAll('[data-fit]'));
  if(!blocs.length) return true;
  let pose = false;
  for(const pic of PICTOS){
    for(const [fs,lh] of ECHELLE){
      blocs.forEach(el => appliquer(el, fs, lh, pic));
      if(!blocs.some(deborde)){ pose = true; break; }
    }
    if(pose) break;
  }
  if(!pose) blocs.forEach(el => appliquer(el, 6.6, 1.16, PICTOS[1]));
  blocs.forEach(repartir);
  return !blocs.some(deborde);
}

function ajusterTout(){
  let ok = true;
  document.querySelectorAll('#pages .page').forEach(p => { if(!ajusterPage(p)) ok = false; });
  return ok;
}

/* ---------- rendu ---------- */
/* la légende de consigne ne s'imprime que sur les pages qui portent le bocal */
function legendes(){
  document.querySelectorAll('#pages .page').forEach(p => {
    const lg = p.querySelector('.legende');
    if(!lg) return;
    const porte = !!p.querySelector('img[data-picto="consigne"]');
    lg.hidden = !porte;
    /* sans le bocal, la légende ne dirait rien : on l'enlève aussi du texte */
    if(!PICTO.consigne) lg.hidden = true;
  });
}

function poser(mode){
  $('#pages').innerHTML = composer(mode).join('');
  const pages = document.querySelectorAll('#pages .page');
  pages.forEach((p,i) => { const n = p.querySelector('.num-page'); if(n) n.textContent = `${i+1} / ${pages.length}`; });
  legendes();
  return ajusterTout();
}

function dessiner(){
  let ok = poser('ref');
  if(!ok) ok = poser('dense');
  const pages = document.querySelectorAll('#pages .page');
  const coches = SECTIONS.reduce((n,s)=>n+sel[s.cle].size,0);
  $('#compteur-pages').textContent = coches
    ? `${pages.length} page${pages.length>1?'s':''} A4${ok?'':' — attention : contenu trop long'}`
    : `Aucun produit coché — seuls les blocs fixes sont imprimés`;
  mettreAJourEntetes();
  cadrer();
}

function mettreAJourEntetes(){
  const nom = etat.boutique.trim();
  document.querySelectorAll('#ent-boutique').forEach(e => e.textContent = nom || 'Boutique');
  const fichier = `${dateISO(new Date())} - CHEFJEAN - carte - ${nom || '<boutique>'}`;
  $('#nom-fichier').textContent = fichier;
  document.title = fichier;
}

/* ---------- aperçu à l'échelle ---------- */
function cadrer(){
  const scene = $('#scene'), pages = $('#pages');
  const dispo = scene.parentElement.clientWidth - 44;
  const largeur = pages.offsetWidth || 703;
  const hauteur = pages.offsetHeight || 1024;
  if(!largeur || !dispo) return;
  const s = Math.min(1, dispo / largeur);
  pages.style.transform = `scale(${s})`;
  pages.style.transformOrigin = 'top left';
  scene.style.width = (largeur * s) + 'px';
  scene.style.height = (hauteur * s) + 'px';
}

/* ---------- sélection ----------
   Tout la carte est cochée d'office : les équipiers décochent seulement ce
   qu'ils n'ont pas en stock (demande de Pierre, 25/11/2026). */
function viderSelection(){
  SECTIONS.forEach(s => sel[s.cle].clear());
  document.querySelectorAll('#selection input[type=checkbox]').forEach(c => { c.checked = false; });
}

function toutCocher(dessine = true){
  SECTIONS.forEach(s => {
    const liste = DATA[s.cle] || [];
    sel[s.cle].clear();
    liste.forEach((p, i) => sel[s.cle].add(i));
  });
  document.querySelectorAll('#selection input[type=checkbox]').forEach(c => { c.checked = true; });
  majTousComptes();
  if(dessine) dessiner();
}

/* ---------- actions ---------- */
function brancher(){
  const inp = $('#boutique');
  inp.value = etat.boutique;
  inp.addEventListener('input', () => {
    inp.classList.remove('manque');
    etat.boutique = inp.value;
    memoriser('chefjean.carte.boutique', inp.value);
    mettreAJourEntetes();
    document.querySelectorAll('#ent-boutique').forEach(e=>e.textContent = inp.value.trim() || 'Boutique');
  });

  $('#btn-cocher').addEventListener('click', () => toutCocher());
  $('#btn-maj').addEventListener('click', remiseAJour);

  $('#btn-decocher').addEventListener('click', () => {
    viderSelection();
    majTousComptes(); dessiner();
  });

  /* réinitialiser = revenir à l'état d'ouverture : nouvelle boutique, tout coché */
  $('#btn-reset').addEventListener('click', () => {
    inp.value = ''; etat.boutique = '';
    memoriser('chefjean.carte.boutique', null);
    mettreAJourEntetes();
    toutCocher();
  });

  $('#btn-imprimer').addEventListener('click', () => {
    if(!etat.boutique.trim()){
      inp.classList.add('manque');
      inp.placeholder = 'Nom de la boutique requis pour imprimer';
      inp.focus();
      return;
    }
    window.print();
  });

  $('#btn-copier').addEventListener('click', async () => {
    const t = $('#nom-fichier').textContent;
    try{ await navigator.clipboard.writeText(t); $('#btn-copier').textContent = 'Copié'; }
    catch(e){ $('#btn-copier').textContent = 'Sélectionnez le nom'; }
    setTimeout(()=>{ $('#btn-copier').textContent = 'Copier le nom'; }, 1600);
  });

  window.addEventListener('resize', cadrer);
}

/* ---------- modes de contrôle (témoin, sélection complète, vérification) ---------- */
function cocher(numero, cle){
  const c = document.querySelector(`#selection input[data-cle="${cle}"][data-i="${numero}"]`);
  if(c && !c.checked){ c.checked = true; c.dispatchEvent(new Event('change',{bubbles:true})); }
}

function verifier(){
  /* contrôle de rendu : pages, débordements, tailles de texte, chevauchements */
  const pages = Array.from(document.querySelectorAll('#pages .page'));
  const rapport = {pages: pages.length, debordements: [], tailles: {}, chevauchements: 0,
                   depassements: [], pages_fs: []};
  pages.forEach((p, idx) => {
    p.querySelectorAll('[data-fit]').forEach(el => {
      if(deborde(el)){
        const b = basDuContenu(el);
        rapport.debordements.push(`${idx+1}:${el.dataset.fit}:${((b.bas-b.boite.bottom)/3.7795).toFixed(1)}mm`);
      }
      const premier = el.querySelector('.item');
      if(premier) rapport.item_mm = +((premier.getBoundingClientRect().height + parseFloat(getComputedStyle(premier).marginBottom))/3.7795).toFixed(1);
      el.querySelectorAll('ul.produits').forEach(ul => {
        const kids = Array.from(ul.children);
        for(let i = 1; i < kids.length; i++){
          const a = kids[i-1].getBoundingClientRect(), b = kids[i].getBoundingClientRect();
          if(b.top < a.bottom - 0.6) rapport.chevauchements++;
        }
      });
      el.querySelectorAll('.mention, .nom, .prix').forEach(t => {
        const r = t.getBoundingClientRect(), c = el.getBoundingClientRect();
        if(r.right > c.right + 0.6 || r.left < c.left - 0.6) rapport.depassements.push(`${idx+1}:${t.className}`);
      });
    });
    const bloc = p.querySelector('[data-fit]');
    if(bloc) rapport.pages_fs.push(parseFloat(bloc.style.getPropertyValue('--fs')) || 0);
    p.querySelectorAll('.nom').forEach(n => {
      const s = parseFloat(getComputedStyle(n).fontSize);
      rapport.tailles.noms = Math.min(rapport.tailles.noms ?? 99, s);
    });
    p.querySelectorAll('.ligne-prix .prix, .b-item .prix-inline').forEach(n => {
      const s = parseFloat(getComputedStyle(n).fontSize);
      rapport.tailles.prix = Math.min(rapport.tailles.prix ?? 99, s);
    });
    p.querySelectorAll('.mention').forEach(n => {
      rapport.tailles.mentions = Math.min(rapport.tailles.mentions ?? 99, parseFloat(getComputedStyle(n).fontSize));
    });
  });
  const pre = document.createElement('pre');
  pre.id = 'verif';
  pre.style.cssText = 'position:absolute;left:-9999px;top:0';
  pre.textContent = 'VERIF ' + JSON.stringify(rapport);
  document.body.appendChild(pre);
}

function demarrer(){
  $('#boutiques').innerHTML = BOUTIQUES.map(b => `<option value="${esc(b)}">`).join('');
  construirePanneau();
  brancher();
  majTousComptes();

  const q = new URLSearchParams(location.search);

  /* tout est coché d'office (mode témoin mis à part) */
  if(q.get('temoin') !== '1') toutCocher(false);

  /* mode témoin : carte d'exemple (boutique Esplanade, sélection partielle) */
  if(q.get('temoin') === '1'){
    etat.boutique = TEMOIN.boutique;
    $('#boutique').value = TEMOIN.boutique;
    memoriser('chefjean.carte.boutique', TEMOIN.boutique);
    viderSelection();
    dessiner();
    Object.entries(TEMOIN.selection).forEach(([cle, liste]) => liste.forEach(i => cocher(i, cle)));
  }

  /* mode vérification : toute la carte cochée */
  if(q.get('tout') === '1'){
    SECTIONS.forEach(s => (DATA[s.cle]||[]).forEach((p,i) => sel[s.cle].add(i)));
    document.querySelectorAll('#selection input[type=checkbox]').forEach(c => c.checked = true);
    majTousComptes();
  }

  dessiner();
  if(q.get('verif') === '1') verifier();
}

if(document.fonts && document.fonts.ready){ document.fonts.ready.then(demarrer); }
else { window.addEventListener('load', demarrer); }
</script>
